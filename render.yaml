# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sharecal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_NOTICE
        value: "1"
