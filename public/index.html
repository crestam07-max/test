<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShareCal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login / sign-up -->
  <section id="auth-screen" class="auth" hidden>
    <div class="auth-card">
      <h1 class="logo">ShareCal</h1>
      <p class="tagline">みんなの予定を、ひとつのカレンダーで。</p>
      <p class="demo-notice" id="demo-notice" hidden>お試し版です。しばらく誰も使わないと、アカウントや予定がリセットされます。</p>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login">ログイン</button>
        <button type="button" class="tab" data-mode="register">新規登録</button>
      </div>
      <form id="auth-form">
        <label class="register-only" hidden>名前<input name="name" maxlength="50" autocomplete="nickname" /></label>
        <label>メールアドレス<input name="email" type="email" required autocomplete="email" /></label>
        <label>パスワード<input name="password" type="password" minlength="6" required autocomplete="current-password" /></label>
        <p class="error" id="auth-error"></p>
        <button class="primary" type="submit" id="auth-submit">ログイン</button>
      </form>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <span class="logo small">ShareCal</span>
        <button type="button" class="icon-btn close-sidebar" aria-label="閉じる">×</button>
      </div>
      <h2>カレンダー</h2>
      <ul id="calendar-list" class="calendar-list"></ul>
      <button type="button" class="ghost" id="new-calendar-btn">＋ 新しいカレンダー</button>

      <h2>最近の更新</h2>
      <ul id="activity-list" class="activity-list"></ul>

      <div class="sidebar-foot">
        <span id="me-name"></span>
        <span class="demo-badge" id="demo-badge" hidden>お試し版</span>
        <button type="button" class="link" id="logout-btn">ログアウト</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar">
        <button type="button" class="icon-btn open-sidebar" aria-label="メニュー">☰</button>
        <div class="month-nav">
          <button type="button" class="icon-btn" id="prev-month" aria-label="前の月">‹</button>
          <h1 id="month-label"></h1>
          <button type="button" class="icon-btn" id="next-month" aria-label="次の月">›</button>
        </div>
        <button type="button" class="ghost light" id="today-btn">今日</button>
        <button type="button" class="ghost light" id="share-btn">共有</button>
      </header>

      <div class="weekdays">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div id="grid" class="grid"></div>

      <button type="button" class="fab" id="add-event-btn" aria-label="予定を追加">＋</button>
    </main>
  </section>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
